<script>
  var idx = DATA.length;
  document.getElementById('count').textContent = idx + ' entries';

  function scoreClass(s) {
    if (s >= 8) return 'score-high';
    if (s >= 6) return 'score-mid';
    return 'score-low';
  }

  function render(items) {
    var html = '';
    for (var i = 0; i < items.length; i++) {
      var a = items[i];
      var tags = '';
      if (a.tags && a.tags.length) {
        tags = a.tags.map(function(t){return '<span class="tag">'+escapeHtml(t)+'</span>'}).join(' ');
      }
      var stars = a.stars ? (' ⭐' + a.stars) : '';
      var lang = a.language ? (' [' + escapeHtml(a.language) + ']') : '';
      var reason = a.score_reason ? ('<div class="card-meta" style="margin-top:4px;color:#6e7681">' + escapeHtml(a.score_reason) + '</div>') : '';
      var title = a.source_url
        ? '<a href="' + escapeAttr(a.source_url) + '" target="_blank" rel="noopener">' + escapeHtml(a.title) + '</a>'
        : escapeHtml(a.title);
      html += '<div class="card">' +
        '<div class="card-title">' + title + '</div>' +
        '<div class="card-summary">' + escapeHtml(a.summary) + '</div>' +
        '<div class="card-meta">' +
          '<span class="badge score ' + scoreClass(a.score) + '">' + a.score + '/10</span>' +
          '<span>' + escapeHtml(a.source) + '</span>' +
          '<span>' + stars + '</span>' +
          '<span>' + lang + '</span>' +
        '</div>' +
        (tags ? '<div class="card-meta" style="margin-top:6px">' + tags + '</div>' : '') +
        reason +
      '</div>';
    }
    document.getElementById('list').innerHTML = html;
    document.getElementById('stats').innerHTML =
      '<span>显示 ' + items.length + ' / ' + DATA.length + ' 条</span>';
  }

  function escapeHtml(s) {
    return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function escapeAttr(s) {
    return (s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;');
  }

  function filter() {
    var q = document.getElementById('search').value.toLowerCase().trim();
    if (!q) { render(DATA); return; }
    var words = q.split(/\s+/);
    var result = [];
    for (var i = 0; i < DATA.length; i++) {
      var a = DATA[i];
      var txt = (a.title+' '+a.summary+' '+(a.tags||[]).join(' ')).toLowerCase();
      var match = true;
      for (var j = 0; j < words.length; j++) {
        if (txt.indexOf(words[j]) === -1) { match = false; break; }
      }
      if (match) result.push(a);
    }
    render(result);
  }

  render(DATA);
</script>
